name: Quality Gates

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: DE Index Drift Check
        run: npm run index:de:check
      - name: Format Check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type And Svelte Check
        run: npm run check
      - name: Unit And Integration Tests
        run: npm test
      - name: Production Build
        run: npm run build
      - name: GitHub Pages Build
        run: npm run build:pages
